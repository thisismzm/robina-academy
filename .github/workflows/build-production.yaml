name: Build Production Image

# Builds the all-in-one image from the root Dockerfile and pushes it to the
# GitHub Container Registry, which deploy/docker-compose.yml pulls from.
#
# Image: ghcr.io/<owner>/robina-academy
# Authenticates with the built-in GITHUB_TOKEN; no secrets to configure.
#
# Tags pushed:
#   main-robina push  -> latest, sha-<short>
#   v1.2.3 git tag    -> 1.2.3, 1.2, sha-<short>
#   manual run        -> sha-<short>

on:
  push:
    branches:
      - main-robina
    tags:
      - 'v*.*.*'
    # Same deny-list as build-community.yaml: these paths never reach the image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'deploy/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never cancel a running publish; queue the next one behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # Registry paths must be lowercase; GitHub owners may not be.
          IMAGE="${REGISTRY}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/robina-academy"
          tags="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            tags="${tags},${IMAGE}:${version},${IMAGE}:${version%.*}"
          elif [ "$EVENT" = "push" ] && [ "$REF_NAME" = "main-robina" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags}"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            LEARNHOUSE_PUBLIC=true
          tags: ${{ steps.meta.outputs.tags }}
          # The source label links the package to this repository, so it
          # inherits the repository's visibility and access settings.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          push: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed"
            echo "$TAGS" | tr ',' '\n' | while read -r tag; do echo "- \`${tag}\`"; done
            echo
            echo "Deploy: set \`APP_TAG=sha-${GITHUB_SHA::7}\` in deploy/.env, then \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
